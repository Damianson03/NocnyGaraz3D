name: Build NocnyGaraz3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move game source into repository
        shell: bash
        run: |
          if [ ! -f app/src/main/java/pl/nocnygaraz/game/GameState.java ]; then
            echo "Migrating embedded project..."

            awk 'BEGIN{p=0} /^H4sI/{p=1} /^PROJECT_ARCHIVE$/{p=0} p' \
              .github/workflows/build-apk.yml > /tmp/project.b64

            base64 -d /tmp/project.b64 > /tmp/project.tar.gz
            tar -xzf /tmp/project.tar.gz -C .

            rm -f .github/workflows/build-apk.yml

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add -A
            git commit -m "Move game source into repository [skip ci]"
            git push
          else
            echo "Game source already exists - migration skipped."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NocnyGaraz3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
