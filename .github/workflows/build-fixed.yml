name: Build APK FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game project
        shell: bash
        run: |
          awk 'BEGIN{p=0} /^H4sI/{p=1} /^PROJECT_ARCHIVE$/{p=0} p' .github/workflows/build-apk.yml > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NocnyGaraz3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
