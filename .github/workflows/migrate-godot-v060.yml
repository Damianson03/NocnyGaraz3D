      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add godot .github/workflows/build-godot-apk.yml README_MIGRATION.md
          if git diff --cached --quiet; then
            echo "Godot files already present - nothing to commit."
          else
            git commit -m "Add Godot v0.6.0 migration"
            git push
          fi
