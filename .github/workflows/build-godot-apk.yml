name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: '4.6.2'
      GODOT_STATUS: 'stable'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest"

      - name: Download Godot
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"

          chmod +x "$GODOT_BIN"

          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -O /tmp/templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"

          mkdir -p "$TEMPLATE_DIR"

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          cp -a \
            /tmp/godot_templates/templates/. \
            "$TEMPLATE_DIR/"

          echo "Installed export templates:"
          ls -la "$TEMPLATE_DIR"

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          rm -f "$HOME/.android/debug.keystore"

          keytool \
            -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$HOME/.android/debug.keystore"

          echo "Debug keystore created:"
          ls -lh "$HOME/.android/debug.keystore"

          keytool \
            -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$JAVA_HOME/bin/java"

      - name: Fix Android export settings
        shell: bash
        run: |
          # Ekran poziomy.
          if grep -q 'window/handheld/orientation=' godot/project.godot; then
            sed -i \
              's|window/handheld/orientation=.*|window/handheld/orientation=0|' \
              godot/project.godot
          fi

          # Aplikacja widoczna w launcherze telefonu.
          if grep -q 'package/show_as_launcher_app=' godot/export_presets.cfg; then
            sed -i \
              's|package/show_as_launcher_app=.*|package/show_as_launcher_app=true|' \
              godot/export_presets.cfg
          fi

          # Korzystamy ze standardowego eksportu Godota,
          # więc nie nadpisujemy Min SDK i Target SDK.
          sed -i \
            '/gradle_build\/min_sdk=/d' \
            godot/export_presets.cfg

          sed -i \
            '/gradle_build\/target_sdk=/d' \
            godot/export_presets.cfg

          echo "===== EXPORT PRESET ====="
          cat godot/export_presets.cfg

          echo "===== PROJECT ORIENTATION ====="
          grep "orientation" godot/project.godot || true

      - name: Verify Godot project
        shell: bash
        run: |
          test -f godot/project.godot
          test -f godot/export_presets.cfg
          test -f godot/scenes/main.tscn
          test -f godot/scripts/main.gd
          test -f godot/scripts/game_state.gd
          test -f godot/scripts/hud.gd
          test -f godot/scripts/world_builder.gd

          echo "Godot project files OK."

      - name: Import Godot project
        shell: bash
        run: |
          godot \
            --headless \
            --path godot \
            --editor \
            --quit \
            --verbose

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p godot/build

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          echo "Debug keystore:"
          echo "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

          godot \
            --headless \
            --path godot \
            --export-debug \
            "Android" \
            "build/NocnyGaraz3D-v0.6.0.apk" \
            --verbose

          test -f godot/build/NocnyGaraz3D-v0.6.0.apk

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"

          ls -lh godot/build/NocnyGaraz3D-v0.6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NocnyGaraz3D-Godot-v0.6.0
          path: godot/build/NocnyGaraz3D-v0.6.0.apk
          if-no-files-found: error
          retention-days: 14
